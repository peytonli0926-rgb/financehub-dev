---
#开发环境
spring:
  profiles: dev
  cloud:
    nacos:
      discovery:
        # 服务注册地址
        server-addr: 127.0.0.1:8848
        username: nacos
        password: nacos
        namespace: financehub-local
        group: financehub-local
      config:
        # 配置中心地址
        server-addr: 127.0.0.1:8848
        # 配置文件格式
        file-extension: yml
        username: nacos
        password: nacos
        namespace: financehub-local
        group: financehub-local
        # 共享配置
        shared-configs[0]:
          data-id: financehub-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}
          group: financehub-local
          refresh: true

